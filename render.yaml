services:
  - type: web
    runtime: python
    name: arotec-web
    plan: free
    branch: main
    autoDeployTrigger: commit
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.6
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: AROTEC_TRUST_RENDER_PROXY
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: AROTEC_ADMIN_PASSWORD
        sync: false
