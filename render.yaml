services:
  - type: web
    runtime: python
    name: arotec-web
    plan: free
    branch: main
    autoDeployTrigger: commit
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.6
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: AROTEC_TRUST_RENDER_PROXY
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: arotec-members-db
          property: connectionString
      - key: AROTEC_ADMIN_PASSWORD
        sync: false

databases:
  - name: arotec-members-db
    plan: free
    region: singapore
    ipAllowList: []
